# Prefix key: Ctrl+a (GNU Screen style)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

set -g base-index 1
setw -g pane-base-index 1
set-option -g status-position top
set -sg escape-time 0

# Window naming - auto rename based on git branch or current command
set -g automatic-rename on
set -g automatic-rename-format "#(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo #{pane_current_command})"

# Window Options
set-window-option -g mode-keys vi

# Pane navigation (vim style)
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# Claude Code integration
bind C split-window -h -l 40% 'claude'
bind R split-window -h -l 40% 'claude --resume'

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# Catppuccin window style - rounded design
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Pane styling - active pane highlighting
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"
set -g pane-border-lines heavy

# 1. Load catppuccin first (defines @catppuccin_status_* variables)
set -g @catppuccin_flavor 'mocha'
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# 2. Set status line (after catppuccin loads)
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# 3. Load plugins (after status line is set)
run '~/.config/tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.config/tmux/plugins/tmux-battery/battery.tmux'

# Initialize TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
